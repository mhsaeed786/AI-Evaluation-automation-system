# =====================================================================
#  Published / advertised reference scores
# =====================================================================
# These are the ORIGINAL model-card scores vendors advertise for the
# models behind the Ollama Cloud offerings. They exist ONLY to compute a
# "measured vs advertised" delta in the report.
#
# IMPORTANT CAVEATS — read before drawing conclusions:
#   1. Methodology differs. Vendors report MMLU/HellaSwag via loglikelihood,
#      5-shot/0-shot varies, n_samples and temperature differ, and HumanEval
#      pass@1 is usually n=20 @ temp 0.2. Our builtin engine uses single-letter
#      logprob (or generate-parse) and pass@1 @ 1 sample by default. So a delta
#      mixes model quality AND methodology — not a pure quality verdict.
#   2. Ollama Cloud serves quantized/hosted builds; even with identical
#      methodology a small gap vs the original BF16 model card run is expected.
#   3. Numbers below are best-effort from public model cards / leaderboards as
#      of generation. ALWAYS verify against the official source (verify: link)
#      and correct before publishing comparisons.
#
#   "advertised" scores are on a 0..100 scale. The runner converts measured
#   0..1 accuracies to the same scale before computing deltas.
# =====================================================================

# Scale reminder: scores are PERCENT (0..100).
defaults:
  scale: percent
  methodology_note: "vendor model-card, loglikelihood unless noted; verify before citing"

