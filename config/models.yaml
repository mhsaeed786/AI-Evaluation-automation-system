# =====================================================================
#  Model registry — multi-provider
#  (Ollama Cloud / Qwen / Groq / OpenRouter / Cerebras / HF / GLM)
# =====================================================================
# This is a CURATED REFERENCE of models that have appeared on each provider.
# It is NOT authoritative:
#   - The runner reconciles this list against the LIVE model list returned by
#     GET /v1/models for the selected provider (see src/smoke_test.py).
#   - If a model below is absent from your live list, it is skipped.
#   - If your live list contains models NOT below, they are included
#     automatically under the "default_profile" profile (see profiles).
#
# Update the `advertised:` scores from each model's official model card
# before drawing vendor comparisons (see published_scores.yaml).
# =====================================================================

default_profile: general

profiles:
  general:  &general
    benchmarks:
      - mmlu
      - mmlu_pro
      - arc_challenge
      - hellaswag
      - winogrande
      - truthfulqa
      - gsm8k
      - gpqa
      - bbh
      - agieval
      - math
  coding:   &coding
    benchmarks:
      - humaneval
      - mbpp
      - livecodebench
      - aider_polyglot
      - bigcodebench
      - swebench_verified
      - swebench_lite
      - deepswe
      - bfcl

  agent_swe: &agent_swe
    benchmarks:
      - swebench_verified
      - swebench_lite
      - deepswe
      - swe_gym
      - swebench_pro
  agent_general: &agent_general
    benchmarks:
      - gaia
      - tau_bench
      - terminalbench
      - osworld
      - intercode
      - cybench
      - mle_bench
      - webarena
      - ctfbench
      - bfcl
      - arc_agi_2
  long_context: &long_context
    benchmarks:
      - ruler
      - hle
  math_hard: &math_hard
    benchmarks:
      - math_500
      - aime_2024
      - aime_2025
      - aime_2026
      - olympiadbench
      - frontiermath
  reasoning: &reasoning
    benchmarks:
      - gpqa
      - gpqa_diamond
      - mmlu_pro
      - bbh
      - math
      - gsm8k
      - mixeval
      - ifeval
      - arena_hard
      - musr

# Provider Tier Policy
# Paid providers: ollama (Ollama Cloud Pro), qwen (Qwen Cloud), glm (Z.AI Coding Plan)
# Free providers: openrouter, groq, cerebras, hf, poe, cohere (Strictly FREE models only)
provider_tiers:
  paid:
    - ollama
    - qwen
    - glm
  free:
    - openrouter
    - groq
    - cerebras
    - hf
    - poe
    - cohere

models:
