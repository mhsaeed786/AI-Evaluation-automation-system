# =====================================================================
#  Benchmark registry
# =====================================================================
# Each entry tells the runner how to run + score one benchmark through
# the builtin engine (Tier 1). The optional harness wrappers
# (Tier 2) read these hints too where applicable.
#
# kind:
#   mcq       -> multiple-choice, scored by answer-letter logprob
#                (falls back to generate-and-parse if no logprobs)
#   math      -> free-form, scored by final-answer extraction + exact match
#   code      -> free-form, scored by executing against a test suite
# engine:    builtin | lm_eval | evalplus
# =====================================================================

benchmarks:
  # ---------- Knowledge / multiple-choice --------------------------
  mmlu:
    cot: true
    kind: mcq
    engine: builtin
    dataset: cais/mmlu        # HF path
    config: all               # combined subject split
    split: test
    n_shot: 5
    metric: acc
    limit: null               # null = full set; set int for a quick run
  mmlu_pro:
    kind: mcq
    engine: builtin
    dataset: TIGER-Lab/MMLU-Pro
    config: default
    split: validation         # MMLU-Pro ships gold only on validation/test
    n_shot: 5
    metric: acc
    limit: null
  arc_challenge:
    kind: mcq
    engine: builtin
    dataset: allenai/ai2_arc
    config: ARC-Challenge
    split: test
    n_shot: 25                # ARC uses 25-shot on leaderboards
    metric: acc_norm
    limit: null
  hellaswag:
    kind: mcq
    engine: builtin
    dataset: Rowan/hellaswag
    config: default
    split: validation
    n_shot: 0
    metric: acc_norm
    limit: null
  winogrande:
    kind: mcq
    engine: builtin
    dataset: allenai/winogrande
    config: winogrande_xl
    split: validation
    n_shot: 5
    metric: acc
    limit: null

  # ---------- Truthfulness / reasoning -----------------------------
  truthfulqa:
    kind: mcq
    engine: builtin
    dataset: truthfulqa/truthfulqa-mc
    config: multiple_choice
    split: validation
    n_shot: 0
    metric: mc1               # reports mc1 (and mc2 where available)
    limit: null
  gpqa:
    kind: mcq
    engine: builtin
    dataset: Idavidrein/gpqa
    config: gpqa_main         # gpqa_main | gpqa_diamond | gpqa_extended
    split: train
    n_shot: 0                 # GPQA is reported 0-shot (CoT optional)
    metric: acc
    cot: true                 # chain-of-thought before answering
    limit: null
  bbh:
    kind: mcq
    engine: builtin
    dataset: lukaemon/bbh
    config: ""                # BBH is a config collection; runner enumerates
    split: test
    n_shot: 3
    metric: acc
    limit: null
  agieval:
    kind: mcq
    engine: builtin
    dataset: hails/agieval
    config: ""                # runner enumerates subtasks
    split: test
    n_shot: 0
    metric: acc
    limit: null

  # ---------- Math --------------------------------------------------
  gsm8k:
    cot: true
    kind: math
    engine: builtin
    dataset: openai/gsm8k
    config: main
    split: test
    n_shot: 8
    metric: acc               # exact-match on final numeric answer
    limit: null
  math:
    kind: math
    engine: builtin
    dataset: EleutherAI/hendrycks_math   # or lighteval/MATH
    config: algebra
    split: test
    n_shot: 4
    metric: acc
    limit: null

  # ---------- Code (builtin sandbox) -------------------------------
  humaneval:
    kind: code
    engine: builtin
    dataset: openai/openai_humaneval
    config: default
    split: test
    n_shot: 0
    metric: pass@1
    samples_per_task: 1       # raise to 20/200 for pass@10/@100
    limit: null
  mbpp:
    kind: code
    engine: builtin
    dataset: google-research-datasets/mbpp
    config: full              # full | sanitized
    split: test
    n_shot: 0
    metric: pass@1
    samples_per_task: 1
    limit: null

  # ---------- Code (Tier-2 harnesses; optional) --------------------
  humaneval_plus:
    kind: code
    engine: evalplus
    dataset: HumanEval
    metric: pass@1
  mbpp_plus:
    kind: code
    engine: evalplus
    dataset: MBPP
    metric: pass@1

  math_500:
    kind: math
    engine: builtin
    dataset: HuggingFaceH4/MATH-500
    split: test
    n_shot: 0
    metric: acc
    limit: null
  aime_2024:
