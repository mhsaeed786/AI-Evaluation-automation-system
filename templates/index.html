<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Evaluation Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #09090b; --panel: #18181b; --panel2: #27272a; --border: #3f3f46;
  --text: #e4e4e7; --muted: #a1a1aa;
  --primary: #3b82f6; --primary-hover: #2563eb;
  --green: #10b981; --yellow: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border); padding: 16px 32px;
  position: sticky; top: 0; background: rgba(9,9,11,0.85);
  backdrop-filter: blur(12px); z-index: 50;
}
header h1 {
  margin: 0; font-size: 1.5rem; font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.meta { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
button {
  background: var(--panel2); color: var(--text); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.875rem;
  font-weight: 500; transition: all 0.2s ease;
}
button:hover { background: #3f3f46; border-color: #52525b; }
button.primary { background: var(--primary); color: #fff; border: none; }
button.primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
button.danger { border-color: var(--red); color: var(--red); background: transparent; }
button.danger:hover { background: rgba(239, 68, 68, 0.1); }
nav.tabs {
  display: flex; gap: 8px; padding: 0 32px; border-bottom: 1px solid var(--border);
  background: var(--panel); overflow-x: auto;
}
nav.tabs button {
  background: none; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; padding: 14px 16px; color: var(--muted); white-space: nowrap;
  font-size: 0.9rem; transition: color 0.2s;
}
nav.tabs button.active { color: var(--text); border-bottom-color: var(--primary); font-weight: 600; }
nav.tabs button:hover { color: var(--text); }
main { padding: 32px; max-width: 1400px; margin: 0 auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s;
}
.card:hover { transform: translateY(-2px); border-color: #52525b; }
.card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.card .value { font-size: 1.75rem; font-weight: 700; color: var(--text); margin-top: 8px; }
.card .value.green { color: var(--green); }
.toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
input, select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; transition: border-color 0.2s;
}
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
input[type=text] { min-width: 260px; flex-grow: 1; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
.table-wrap {
  overflow: auto; background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; max-height: 70vh; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--panel2); color: var(--muted); text-align: left; position: sticky; top: 0; cursor: pointer; font-weight: 600; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; font-weight: 500; }
tbody tr { transition: background-color 0.15s; }
tbody tr:hover td { background: rgba(59, 130, 246, 0.05); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 0.75rem; text-align: center; }
.s100 { background: rgba(16, 185, 129, 0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
.hi { background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid rgba(59,130,246,0.2); }
.mid { background: rgba(245, 158, 11, 0.1); color: var(--yellow); border: 1px solid rgba(245,158,11,0.2); }
.lo { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
.na { color: var(--muted); font-style: italic; }
.delta-neg { color: var(--red); font-weight: 500; }
.delta-pos { color: var(--green); font-weight: 500; }
.delta-na { color: var(--muted); }
.empty { padding: 60px; text-align: center; color: var(--muted); font-size: 1.1rem; }
.empty code, .note code { background: var(--panel2); padding: 2px 6px; border-radius: 6px; color: var(--text); font-family: monospace; }
.note {
  background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.3);
  color: var(--yellow); padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px;
}
.tag { font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; margin-left: 8px; }
.hidden { display: none; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.section-title { font-size: 1.25rem; font-weight: 600; margin: 0 0 16px; color: var(--text); }
.subsection {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
.provider-row {
  display: flex; flex-wrap: wrap; gap: 16px; padding: 16px;
  background: var(--panel2); border: 1px solid var(--border);
  border-radius: 8px; margin-bottom: 12px; align-items: center; transition: border-color 0.2s;
}
.provider-row:hover { border-color: #52525b; }
.provider-row .pname { font-weight: 600; font-size: 1.1rem; min-width: 140px; display: flex; align-items: center; gap: 8px; }
.provider-row .ptype { font-size: 0.75rem; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; background: var(--bg); }
.provider-row .pkey { font-size: 0.75rem; color: var(--green); background: rgba(16,185,129,0.1); padding: 2px 8px; border-radius: 6px; }
.provider-row .pnokey { font-size: 0.75rem; color: var(--red); background: rgba(239,68,68,0.1); padding: 2px 8px; border-radius: 6px; }
.provider-inputs { display: flex; flex-wrap: wrap; gap: 12px; flex-grow: 1; align-items: center; }
.provider-inputs label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); flex: 1; min-width: 200px; }
.bench-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.bench-chip {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.875rem; cursor: pointer; transition: all 0.2s;
}
.bench-chip:hover { border-color: var(--primary); background: rgba(59,130,246,0.05); }
.bench-chip.disabled { opacity: 0.5; background: var(--bg); }
.bench-chip .bkind { font-size: 0.7rem; color: var(--muted); margin-left: auto; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
.compare-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; background: var(--panel); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
.dl-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
.dl-buttons button { display: flex; align-items: center; gap: 8px; }
.industry-table th { cursor: default; }

/* Modal Styles */
.modal-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; width: 100%; max-width: 480px;
  transform: translateY(20px); transition: transform 0.2s;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
}
.modal-backdrop.show .modal { transform: translateY(0); }
.modal-header { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; }
.modal-close:hover { color: var(--text); background: none; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 0.875rem; color: var(--muted); }
.form-group input, .form-group select { width: 100%; }
.modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>AI Evaluation Dashboard</h1>
    <div class="meta" id="meta">Loading...</div>
  </div>
  <div class="row">
    <span class="meta" id="updated"></span>
    <button onclick="window.loadAll()">&#8635; Refresh</button>
  </div>
</header>
<nav class="tabs">
  <button class="active" onclick="window.showTab('overview',this)">Overview</button>
  <button onclick="window.showTab('matrix',this)">Measured Matrix</button>
  <button onclick="window.showTab('deltas',this)">Measured vs Advertised</button>
  <button onclick="window.showTab('providers',this)">By Provider</button>
  <button onclick="window.showTab('compare',this)">Model Compare</button>
  <button onclick="window.showTab('settings',this)">Settings</button>
  <button onclick="window.showTab('reports',this)">Reports</button>
  <button onclick="window.showTab('run',this)">&#9654; Run</button>
</nav>
<main>
  <section id="tab-overview"></section>
  <section id="tab-matrix" class="hidden"></section>
  <section id="tab-deltas" class="hidden"></section>
  <section id="tab-providers" class="hidden"></section>
  <section id="tab-compare" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
  <section id="tab-reports" class="hidden"></section>
  <section id="tab-run" class="hidden"></section>
</main>
<script>
const S={};let chart=null;
const pctClass=v=>v==null?'na':v>=95?'s100':v>=70?'hi':v>=40?'mid':'lo';
const pctStr=v=>v==null?'\u2014':v.toFixed(1)+'%';
const $=id=>document.getElementById(id);
async function get(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json();}
function emptyNote(){return '<div class="empty">No results yet. Run <code>python -m src.runner --provider all --benchmarks all --quick</code> (or use the <b>&#9654; Run</b> tab) then click Refresh.</div>';}

window.loadAll = async function(){
  try{
    const[ov,mx,dl,pv,rn,cfg]=await Promise.all([
      get('/api/overview'),get('/api/matrix'),get('/api/deltas'),
      get('/api/providers'),get('/api/runs'),get('/api/config')]);
    S.overview=ov;S.matrix=mx;S.deltas=dl;S.providers=pv;S.runs=rn;S.config=cfg;
    $('meta').textContent='Endpoint '+cfg.base_url+'  \u00b7  '+cfg.providers.length+' providers configured';
    $('updated').textContent='Updated '+new Date().toLocaleTimeString();
    renderOverview();renderMatrix();renderDeltas();renderProviders();renderRuns();renderRun();
    window.renderSettings();

  }catch(e){$('tab-overview').innerHTML='<div class="empty">Failed to load: '+e+' \u2014 is the server running? (<code>python -m src.server</code>)</div>';}
}
window.showTab = function(id, btn){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden'));
  $('tab-'+id).classList.remove('hidden');
  if(id==='overview'&&chart)chart.resize();
  if(id==='settings')loadSettings();
  if(id==='reports')loadReports();
  if(id==='compare')renderCompareTab();
}

/* ===== Overview ===== */
function renderOverview(){
  const o=S.overview;
  if(!o.n_runs){$('tab-overview').innerHTML=emptyNote();return;}
  let html='<div class="cards">'
    +card('Models',o.n_models)+card('Benchmarks',o.n_benchmarks)+card('Providers',o.n_providers)
    +card('Runs',o.n_runs)+card('Avg score',o.avg_score.toFixed(1)+'%')
    +card('Top model',(o.top_model||'\u2014')+'<span class="tag">'+o.top_score.toFixed(1)+'%</span>',1)
    +'</div>';
  const entries=Object.entries(o.model_avg||{}).sort((a,b)=>b[1]-a[1]).slice(0,20);
  html+='<div class="chart-box"><div class="label" style="margin-bottom:8px;color:var(--muted)">Top models by average score</div><canvas id="ovChart" height="100"></canvas></div>';
  html+='<div class="chart-box"><div class="label" style="margin-bottom:8px;color:var(--muted)">Providers seen</div><div class="row">'+o.providers.map(p=>'<span class="tag">'+p+'</span>').join(' ')+'</div></div>';
  $('tab-overview').innerHTML=html;
  drawChart(entries);
}
function card(label,value,green){return '<div class="card"><div class="label">'+label+'</div><div class="value'+(green?' green':'')+'">'+value+'</div></div>';}
function drawChart(entries){
  if(typeof Chart==='undefined'||!entries.length)return;
  if(chart)chart.destroy();
  chart=new Chart($('ovChart'),{type:'bar',
    data:{labels:entries.map(e=>e[0]),datasets:[{label:'avg %',data:entries.map(e=>e[1]),backgroundColor:'#58a6ff'}]},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{max:100,grid:{color:'#21262d'},ticks:{color:'#8b949e'}},y:{grid:{display:false},ticks:{color:'#8b949e'}}}}});
}

/* ===== Matrix ===== */
function renderMatrix(){
  const m=S.matrix;
  if(!m.models.length){$('tab-matrix').innerHTML=emptyNote();return;}
  $('tab-matrix').innerHTML='<div class="toolbar"><input id="mtxSearch" type="text" placeholder="Filter models..." oninput="renderMatrixTable()"></div><div class="table-wrap"><table id="mtxTable"></table></div>';
  renderMatrixTable();
}
function renderMatrixTable(){
  const m=S.matrix;const q=(($('mtxSearch')||{}).value||'').toLowerCase();
  const models=m.models.filter(x=>x.toLowerCase().includes(q));
  let h='<thead><tr><th>Model</th>'+m.benchmarks.map(b=>'<th>'+b+'</th>').join('')+'</tr></thead><tbody>';
  for(const mdl of models){
    h+='<tr><td><strong>'+mdl+'</strong></td>';
    for(const b of m.benchmarks){
      const v=(m.cells[mdl]||{})[b];const meta=m.meta[mdl+'::'+b]||{};
      h+='<td title="'+(meta.engine||'')+' \u00b7 '+(meta.provider||'')+' \u00b7 n='+(meta.n||0)+'"><span class="pill '+pctClass(v)+'">'+pctStr(v)+'</span></td>';
    }
    h+='</tr>';
  }
  $('mtxTable').innerHTML=h+'</tbody>';
}

/* ===== Deltas ===== */
let deltaOnlyAdv=true,deltaSort={k:'delta',dir:1};
function renderDeltas(){
  const d=S.deltas;
  if(!d.rows.length){$('tab-deltas').innerHTML=emptyNote();return;}
  $('tab-deltas').innerHTML='<div class="toolbar"><label><input type="checkbox" id="onlyAdv" '+(deltaOnlyAdv?'checked':'')+' onchange="deltaOnlyAdv=this.checked;renderDeltasTable()"> Only benchmarks with an advertised reference</label></div><div class="table-wrap"><table id="dlTable"></table></div>';
  renderDeltasTable();
}
function renderDeltasTable(){
  let rows=S.deltas.rows.slice();
  if(deltaOnlyAdv)rows=rows.filter(r=>r.advertised!=null);
  const k=deltaSort.k,dir=deltaSort.dir;
  rows.sort((a,b)=>{const av=a[k],bv=b[k];if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;return (av<bv?-1:av>bv?1:0)*dir;});
  const th=(kk,lb)=>'<th onclick="deltaSort={k:\''+kk+'\',dir:(deltaSort.k==\''+kk+'\'?-deltaSort.dir:1)};renderDeltasTable()">'+lb+(deltaSort.k===kk?(deltaSort.dir>0?' \u25B2':' \u25BC'):'')+'</th>';
  let h='<thead><tr>'+th('model','Model')+th('provider','Provider')+th('benchmark','Benchmark')+th('measured','Measured')+th('advertised','Advertised')+th('delta','\u0394')+'</tr></thead><tbody>';
  for(const r of rows){
    const dc=r.delta==null?'delta-na':(r.delta<0?'delta-neg':'delta-pos');
    h+='<tr><td><strong>'+r.model+'</strong></td><td>'+r.provider+'</td><td>'+r.benchmark+'</td>'
      +'<td><span class="pill '+pctClass(r.measured)+'">'+pctStr(r.measured)+'</span></td>'
      +'<td>'+(r.advertised==null?'<span class="na">n/a</span>':r.advertised.toFixed(1)+'%')+'</td>'
      +'<td class="'+dc+'"><strong>'+(r.delta==null?'\u2014':(r.delta>=0?'+':'')+r.delta.toFixed(1))+'</strong><span class="tag">n='+r.n+'</span></td></tr>';
  }
  $('dlTable').innerHTML=h+'</tbody>';
}

/* ===== By Provider ===== */
function renderProviders(){
  const p=S.providers;
  if(!p.models.length){$('tab-providers').innerHTML=emptyNote();return;}
  let html='<div class="note">Compare one <strong>model</strong> across every provider serving it \u2014 a big spread hints at quantization or a silently-swapped backend.</div>';
  html+='<div class="toolbar"><span class="label" style="color:var(--muted)">Model:</span> <select id="provModel" onchange="renderProvCompare()">'+p.models.map(m=>'<option>'+m+'</option>').join('')+'</select></div>';
  html+='<div class="table-wrap" id="provCompare"></div>';
  $('tab-providers').innerHTML=html;
  renderProvCompare();
}
function renderProvCompare(){
  const p=S.providers;const mdl=($('provModel')||{}).value||p.models[0];
  const provs=p.providers.filter(pr=>p.cells[pr]&&p.cells[pr][mdl]);
  let h;
  if(!provs.length){h='<div class="empty">No provider has run <code>'+mdl+'</code> yet.</div>';}
  else{
    h='<table><thead><tr><th>Benchmark</th>'+provs.map(pr=>'<th>'+pr+'</th>').join('')+'</tr></thead><tbody>';
    for(const b of p.benchmarks){
      const vals=provs.map(pr=>((p.cells[pr]||{})[mdl]||{})[b]);
      if(vals.every(v=>v==null))continue;
      h+='<tr><td><strong>'+b+'</strong></td>'+vals.map(v=>'<td><span class="pill '+pctClass(v)+'">'+pctStr(v)+'</span></td>').join('')+'</tr>';
    }
    h+='</tbody></table>';
  }
  $('provCompare').innerHTML=h;
}

/* ===== Model Compare ===== */
function renderCompareTab(){
  let html='<div class="note">Compare two models side-by-side across all benchmarks they share.</div>';
  html+='<div class="compare-bar"><span>Model A:</span><select id="cmpA"></select> <span>Model B:</span><select id="cmpB"></select> <button class="primary" onclick="runCompare()">Compare</button></div>';
  html+='<div id="cmpResult"></div>';
  $('tab-compare').innerHTML=html;
  const models=S.matrix.models||[];
  $('cmpA').innerHTML=models.map(m=>'<option>'+m+'</option>').join('');
  $('cmpB').innerHTML=models.map(m=>'<option>'+m+'</option>').join('');
  if(models.length>1)$('cmpB').selectedIndex=1;
}
async function runCompare(){
  const a=$('cmpA').value,b=$('cmpB').value;
  if(a===b){$('cmpResult').innerHTML='<div class="empty">Select two different models.</div>';return;}
  $('cmpResult').innerHTML='<div class="empty">Loading...</div>';
  try{
    const d=await get('/api/compare?a='+encodeURIComponent(a)+'&b='+encodeURIComponent(b));
    if(!d.rows.length){$('cmpResult').innerHTML='<div class="empty">No shared benchmarks between these models.</div>';return;}
    let h='<div class="table-wrap"><table><thead><tr><th>Benchmark</th><th>'+a+' (measured)</th><th>'+a+' (advertised)</th><th>'+b+' (measured)</th><th>'+b+' (advertised)</th></tr></thead><tbody>';
    for(const r of d.rows){
      h+='<tr><td><strong>'+r.benchmark+'</strong></td>'
        +'<td><span class="pill '+pctClass(r.a_measured)+'">'+pctStr(r.a_measured)+'</span></td>'
        +'<td>'+(r.a_advertised==null?'<span class="na">n/a</span>':r.a_advertised.toFixed(1)+'%')+'</td>'
        +'<td><span class="pill '+pctClass(r.b_measured)+'">'+pctStr(r.b_measured)+'</span></td>'
        +'<td>'+(r.b_advertised==null?'<span class="na">n/a</span>':r.b_advertised.toFixed(1)+'%')+'</td></tr>';
    }
    $('cmpResult').innerHTML=h+'</tbody></table></div>';
  }catch(e){$('cmpResult').innerHTML='<div class="empty">Error: '+e+'</div>';}
}

/* ===== Run History ===== */
function renderRuns(){
  const r=S.runs;
  if(!r.runs.length){$('tab-runs').innerHTML='';return;}
  let h='<div class="table-wrap"><table><thead><tr><th>Time</th><th>Provider</th><th>Model</th><th>Benchmark</th><th>Engine</th><th>Score</th><th>n</th></tr></thead><tbody>';
  for(const x of r.runs){
    h+='<tr><td>'+(x.timestamp||'')+'</td><td>'+x.provider+'</td><td>'+x.model+'</td><td>'+x.benchmark+'</td><td>'+x.engine+'</td>'
      +'<td><span class="pill '+pctClass(x.score)+'">'+pctStr(x.score)+'</span></td><td>'+x.n+'</td></tr>';
  }
  $('tab-runs').innerHTML=h+'</tbody></table></div>';
}

/* ===== Settings ===== */
let settingsData=null;
let customProvidersToAdd = {};

async function loadSettings(){
  if(settingsData){renderSettings();return;}
  try{
    settingsData=await get('/api/settings');
    renderSettings();
  }catch(e){$('tab-settings').innerHTML='<div class="empty">Failed to load settings: '+e+'</div>';}
}

function openModal() { document.getElementById('addProviderModal').classList.add('show'); }
function closeModal() { document.getElementById('addProviderModal').classList.remove('show'); }

function addCustomProvider() {
  const name = $('cpName').value.trim().toLowerCase();
  const type = $('cpType').value;
  const url = $('cpUrl').value.trim();
  const keyVar = $('cpKeyVar').value.trim() || (name.toUpperCase() + '_API_KEY');
  const keyValue = $('cpKeyValue').value.trim();

  if (!name || !url) { alert('Name and Base URL are required.'); return; }
  if (settingsData.providers.some(p => p.name === name)) { alert('Provider already exists.'); return; }

  const newProv = {
    name: name,
    api_type: type,
    url_env: name.toUpperCase() + '_BASE_URL',
    key_env: keyVar,
    url: url,
    has_key: !!keyValue,
    models: 'auto',
    is_custom: true,
    _new_key_val: keyValue
  };

  settingsData.providers.push(newProv);
  customProvidersToAdd[name] = [type, newProv.url_env, newProv.key_env, url];

  closeModal();
  renderSettings();
}

window.renderSettings = function(){

  if(!s || !s.providers) return;
  let html='';

  // Providers
  html+='<div class="subsection">';
  html+='<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">';
  html+='<div class="section-title" style="margin:0;">Providers</div>';
  html+='<button class="primary" onclick="openModal()">+ Add Custom Provider</button>';
  html+='</div>';

  html+='<div class="note">Paid tiers (ollama, qwen, glm) use all models. Free tiers use curated free/text models only. Edit model lists below (comma-separated, or <code>auto</code> for paid).</div>';

  for(const p of s.providers){

    html+='    <label>Models<input type="text" id="pm_'+p.name+'" value="'+models+'"></label>';
    html+='    <label>Base URL<input type="text" id="purl_'+p.name+'" value="'+(p.url||'')+'" placeholder="default"></label>';
    html+='    <label>API Key<input type="password" id="pkey_'+p.name+'" placeholder="'+(p.has_key?'••••••••':'Enter key to set/update')+'"></label>';
    html+='  </div>';
    html+='</div>';
  }
  html+='</div>';

  // Benchmarks
  html+='<div class="subsection"><div class="section-title">Benchmarks</div>';
  html+='<div class="note">Uncheck benchmarks to skip them. Disabled benchmarks are saved to benchmarks.yaml.</div>';
  html+='<div class="bench-grid">';
  for(const b of s.benchmarks){
    html+='<div class="bench-chip'+(b.enabled?'':' disabled')+'" onclick="this.classList.toggle(\'disabled\')"><input type="checkbox" id="bench_'+b.name+'" '+(b.enabled?'checked':'')+'><span>'+b.name+'</span><span class="bkind">'+b.kind+'</span></div>';
  }
  html+='</div></div>';

  // Sampling
  html+='<div class="subsection"><div class="section-title">Sampling Defaults</div>';
  html+='<div class="row">';
  html+='<label class="col" style="gap:4px; font-size:0.875rem;">Seed <input type="number" id="s_seed" value="'+s.sampling.seed+'" style="width:100px"></label>';
  html+='<label class="col" style="gap:4px; font-size:0.875rem;">Temperature <input type="number" id="s_temp" value="'+s.sampling.temperature+'" step="0.1" style="width:100px"></label>';
  html+='<label class="col" style="gap:4px; font-size:0.875rem;">Timeout (s) <input type="number" id="s_timeout" value="'+s.sampling.timeout+'" style="width:100px"></label>';
  html+='</div></div>';

  // Save
  html+='<div style="display:flex; gap:16px; align-items:center;">';
  html+='<button class="primary" style="padding:12px 24px; font-size:1rem;" onclick="saveSettings()">Save Settings</button>';
  html+='<span class="meta" id="saveStatus"></span>';
  html+='</div>';

  $('tab-settings').innerHTML=html;
}

async function saveSettings(){
  const s=settingsData;
  if(!s || !s.providers) return;
  const pm={};
  const envUpdates={};
  const customProvsToAdd={};

  for(const p of s.providers){
    const v=$('pm_'+p.name).value.trim();
    pm[p.name]=v==='auto'?'auto':v.split(',').map(x=>x.trim()).filter(Boolean);

    // Check for url/key updates
    const urlVal = $('purl_'+p.name).value.trim();
    const keyVal = $('pkey_'+p.name).value.trim();

    if (p.is_custom) {
       // if it's already in customProvidersToAdd (brand new)
       if (customProvidersToAdd[p.name]) {
           customProvsToAdd[p.name] = customProvidersToAdd[p.name];
           // override with current inputs in case user changed them before saving
           if (urlVal) { customProvsToAdd[p.name][3] = urlVal; envUpdates[p.url_env] = urlVal; }
           // get the key we stored when adding, or the new one if typed
           const k = keyVal || p._new_key_val;
           if (k) envUpdates[p.key_env] = k;
       } else {
           // existing custom provider being updated
           customProvsToAdd[p.name] = [p.api_type, p.url_env, p.key_env, urlVal || p.url];
           if (urlVal && urlVal !== p.url) { envUpdates[p.url_env] = urlVal; }
           if (keyVal) { envUpdates[p.key_env] = keyVal; }
       }
    } else {
       if (urlVal && urlVal !== p.url) { envUpdates[p.url_env] = urlVal; }
       if (keyVal) { envUpdates[p.key_env] = keyVal; }
    }
  }

  const disabled=[];
  for(const b of s.benchmarks){if(!$('bench_'+b.name).checked)disabled.push(b.name);}
  const sampling={seed:parseInt($('s_seed').value)||1234,temperature:parseFloat($('s_temp').value)||0.0,timeout:parseInt($('s_timeout').value)||120};

  $('saveStatus').textContent='saving...';
  try{
    const payload = {
       provider_models: pm,
       disabled_benchmarks: disabled,
       sampling: sampling,
       env_updates: envUpdates,
       custom_providers: Object.keys(customProvsToAdd).length > 0 ? customProvsToAdd : null
    };

    const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    $('saveStatus').textContent='Saved: '+(j.saved||[]).join(', ');

    // clear memory of newly added ones
    customProvidersToAdd = {};

    settingsData=null; // force reload on next visit

    // Refresh to show masked keys
    setTimeout(loadSettings, 1000);
  }catch(e){$('saveStatus').textContent='Error: '+e;}
}

async function loadReports(){
  let html='';
  // Download buttons
  html+='<div class="subsection"><div class="section-title">Download Reports</div>';
  html+='<div class="dl-buttons">';
  html+='<button class="primary" onclick="window.location=\'/api/export/csv\'">&#11015; CSV</button>';

  html+='</div></div>';

  html+='<div class="subsection"><div class="section-title">Industry Benchmark Reference</div>';
  html+='<div id="industryContent">Loading...</div></div>';
  $('tab-reports').innerHTML=html;
  if(!industryData){
    try{industryData=await get('/api/industry');}catch(e){$('industryContent').innerHTML='Error: '+e;return;}
  }

function renderIndustry(){
  const d=industryData;
  let html='<div class="table-wrap"><table class="industry-table"><thead><tr><th>Benchmark</th><th>Kind</th><th>Description</th><th>Max</th></tr></thead><tbody>';
  for(const[k,v]of Object.entries(d.benchmarks)){
    html+='<tr><td><strong>'+v.name+'</strong><span class="tag">'+k+'</span></td><td>'+v.kind+'</td><td>'+v.description+'</td><td>'+v.max_score+'</td></tr>';
  }
  html+='</tbody></table></div>';
  // Published scores
  html+='<div class="section-title" style="margin-top:18px">Published / Advertised Scores</div>';
  html+='<div class="table-wrap"><table><thead><tr><th>Model</th>';
  const allBench= new Set();
  for(const m of Object.keys(d.published_scores)){for(const b of Object.keys(d.published_scores[m]))allBench.add(b);}
  const benchList=Array.from(allBench).sort();
  html+=benchList.map(b=>'<th>'+b+'</th>').join('')+'</tr></thead><tbody>';
  for(const[m,scores]of Object.entries(d.published_scores)){
    html+='<tr><td><strong>'+m+'</strong></td>'+benchList.map(b=>{const v=scores[b];return v!=null?'<td>'+v.toFixed(1)+'%</td>':'<td class="na">-</td>';}).join('')+'</tr>';
  }
  html+='</tbody></table></div>';
  $('industryContent').innerHTML=html;
}

  h+='<div class="col" style="max-width:600px">';

  h+='<label><input type="checkbox" id="rQuick" checked> quick (small samples)</label>';
  h+='<div class="row"><button class="primary" onclick="startRun()">&#9654; Start run</button><span class="meta" id="runStatus"></span></div>';
  h+='</div>';
  $('tab-run').innerHTML=h;

async function startRun(){
  const body={provider:$('rProv').value,models:$('rModels').value,benchmarks:$('rBench').value,engine:$('rEng').value,quick:$('rQuick').checked};
  $('runStatus').textContent='starting...';
  try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    $('runStatus').textContent=j.ok?j.message:('error: '+(j.error||r.status));
    if(j.ok)setTimeout(window.loadAll,15000);
  }catch(e){$('runStatus').textContent='failed: '+e;}
}
